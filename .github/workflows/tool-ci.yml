name: Tool CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tool-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tool-checks:
    name: Tool / typecheck, tests and builds
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - name: Locked setup, typecheck, tests, frontend and C# worker
        shell: pwsh
        run: ./Tools/ci-check.ps1 -Prepare
      - name: Assert sources and locks were not changed
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'CI changed tracked inputs' }
          git diff --cached --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'CI changed the Git index' }
          if (Test-Path config/local.json) { throw 'CI must not create or copy local config' }
      - name: Package complete tool runtime sources and build
        id: package
        if: github.event_name == 'push'
        shell: pwsh
        run: ./Tools/ci-package.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: tool-checks-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: success() && github.event_name == 'push'
        with:
          name: tool-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.package.outputs.path }}
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
