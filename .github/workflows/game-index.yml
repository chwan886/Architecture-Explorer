name: Game SHA index
run-name: Game ${{ inputs.source_sha }} from run ${{ inputs.source_run_id }}
on:
  workflow_dispatch:
    inputs:
      contract_version:
        description: Fixed contract version (1)
        required: true
        type: string
      source_repo:
        description: Fixed source repository (chwan886/GameDemo02)
        required: true
        type: string
      source_ref:
        description: Fixed game source ref (refs/heads/main)
        required: true
        type: string
      source_sha:
        description: Exact lowercase 40-character game commit SHA
        required: true
        type: string
      source_run_id:
        description: Successful main Fast/tools source run ID
        required: true
        type: string
      source_run_url:
        description: Canonical GitHub source run URL
        required: true
        type: string
      source_run_attempt:
        description: Exact source workflow run attempt
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: game-index-${{ inputs.source_sha }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build-index:
    if: github.repository == 'chwan886/Architecture-Explorer' && github.ref == 'refs/heads/main'
    name: Build tool and verify exact game SHA
    runs-on: windows-2025
    timeout-minutes: 60
    environment: architecture-delivery
    outputs:
      producer_run_id: ${{ steps.release-inputs.outputs.producer_run_id }}
      producer_attempt: ${{ steps.release-inputs.outputs.producer_attempt }}
      producer_tool_sha: ${{ steps.release-inputs.outputs.producer_tool_sha }}
      tool_artifact_id: ${{ steps.tool-artifact.outputs.artifact-id }}
      tool_artifact_digest: ${{ steps.tool-artifact.outputs.artifact-digest }}
      index_artifact_id: ${{ steps.index-artifact.outputs.artifact-id }}
      index_artifact_digest: ${{ steps.index-artifact.outputs.artifact-digest }}
      checks_artifact_id: ${{ steps.checks-artifact.outputs.artifact-id }}
      checks_artifact_digest: ${{ steps.checks-artifact.outputs.artifact-digest }}
    defaults:
      run:
        shell: pwsh
        working-directory: tool
    env:
      CI_CONTRACT_VERSION: ${{ inputs.contract_version }}
      CI_SOURCE_REPO: ${{ inputs.source_repo }}
      CI_SOURCE_REF: ${{ inputs.source_ref }}
      CI_SOURCE_SHA: ${{ inputs.source_sha }}
      CI_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      CI_SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
      CI_SOURCE_RUN_URL: ${{ inputs.source_run_url }}
    steps:
      - name: Checkout exact receiving main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: tool
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: tool/.python-version
      - name: Reject malformed dispatch before obtaining cross-repository credentials
        env:
          INDEX_ACCESS_APPROVED: ${{ vars.INDEX_ACCESS_APPROVED }}
          GAME_CI_WORKFLOW_PATH: ${{ vars.GAME_CI_WORKFLOW_PATH }}
          GAME_REQUIRED_JOB_NAMES: ${{ vars.GAME_REQUIRED_JOB_NAMES }}
          GAME_REQUIRED_CHECK_CONTEXTS: ${{ vars.GAME_REQUIRED_CHECK_CONTEXTS }}
          RULE_BYPASS_REVIEWED: ${{ vars.RULE_BYPASS_REVIEWED }}
        run: |
          # Native PowerShell preflight avoids spending setup time on untrusted strings.
          if ($env:GITHUB_REF_PROTECTED -cne 'true') { throw 'Receiving main must be protected before credentials are requested' }
          if ($env:CI_CONTRACT_VERSION -cne '1' -or $env:CI_SOURCE_REF -cne 'refs/heads/main') { throw 'Only contract v1 game main is accepted' }
          if ($env:CI_SOURCE_REPO -cne 'chwan886/GameDemo02') { throw 'Unapproved source repository' }
          if ($env:CI_SOURCE_SHA -cnotmatch '^[a-f0-9]{40}$') { throw 'Exact lowercase game SHA required' }
          if ($env:CI_SOURCE_RUN_ID -notmatch '^[1-9][0-9]{0,19}$') { throw 'Invalid source run ID' }
          if ($env:CI_SOURCE_RUN_ATTEMPT -notmatch '^[1-9][0-9]{0,19}$') { throw 'Invalid source run attempt' }
          if ($env:CI_SOURCE_RUN_URL -cne ('https://github.com/chwan886/GameDemo02/actions/runs/'+$env:CI_SOURCE_RUN_ID)) { throw 'Source run URL mismatch' }
          if ($env:INDEX_ACCESS_APPROVED -cne 'true' -or $env:RULE_BYPASS_REVIEWED -cne 'true' -or !$env:GAME_CI_WORKFLOW_PATH -or !$env:GAME_REQUIRED_JOB_NAMES -or !$env:GAME_REQUIRED_CHECK_CONTEXTS) { throw 'Controller handoff / rule bypass / artifact access review not configured' }
      - name: Locked setup, typecheck, tests, frontend and C# worker
        id: checks
        run: ./Tools/ci-check.ps1 -Prepare
      - name: Package tool separately from game evidence
        id: package
        run: ./Tools/ci-package.ps1
      - name: Verify packaged runtime and retained source excerpt disclosure
        id: package-runtime
        env:
          CI_PACKAGE_ROOT: ${{ steps.package.outputs.path }}
        run: |
          & ./.tools/node-v24.22.0-win-x64/node.exe node_modules/tsx/dist/cli.mjs Tools/ci-package-smoke.ts
          if ($LASTEXITCODE -ne 0) { throw 'Packaged runtime verification failed' }
      - name: Restricted game read token
        id: game-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.GAME_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.GAME_READ_APP_PRIVATE_KEY }}
          owner: chwan886
          repositories: GameDemo02
          permission-contents: read
          permission-actions: read
          permission-administration: read
          permission-pull-requests: read
      - name: Verify source jobs, protected main history and evidence audience
        id: authorize
        env:
          GAME_READ_TOKEN: ${{ steps.game-token.outputs.token }}
          TOOL_POLICY_READ_TOKEN: ${{ github.token }}
          INDEX_ACCESS_APPROVED: ${{ vars.INDEX_ACCESS_APPROVED }}
          GAME_CI_WORKFLOW_PATH: ${{ vars.GAME_CI_WORKFLOW_PATH }}
          GAME_REQUIRED_JOB_NAMES: ${{ vars.GAME_REQUIRED_JOB_NAMES }}
          GAME_REQUIRED_CHECK_CONTEXTS: ${{ vars.GAME_REQUIRED_CHECK_CONTEXTS }}
          RULE_BYPASS_REVIEWED: ${{ vars.RULE_BYPASS_REVIEWED }}
        run: |
          & ./.tools/node-v24.22.0-win-x64/node.exe node_modules/tsx/dist/cli.mjs Tools/ci-authorize.ts
          if ($LASTEXITCODE -ne 0) { throw 'Delivery authorization failed' }
      - name: Checkout exact authorized game commit (never latest main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: chwan886/GameDemo02
          ref: ${{ inputs.source_sha }}
          token: ${{ steps.game-token.outputs.token }}
          path: game
          fetch-depth: 0
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Prepare pinned Unity metadata references on tool side
        env:
          UNITY_REFERENCES_ASSET_ID: ${{ vars.UNITY_REFERENCES_ASSET_ID }}
          UNITY_REFERENCES_READ_TOKEN: ${{ github.token }}
          UNITY_REFERENCES_URL: ${{ secrets.UNITY_REFERENCES_URL }}
          UNITY_REFERENCES_SHA256: ${{ vars.UNITY_REFERENCES_SHA256 }}
        run: ./Tools/ci-references.ps1
      - name: Scan, Verify, Audit and attest read-only game SHA
        id: snapshot
        run: |
          $env:CI_GAME_ROOT=Join-Path $env:GITHUB_WORKSPACE 'game'
          $env:CI_UNITY_REFERENCES=Join-Path (Get-Location) '.ci-references/references.json'
          $env:CI_DOTNET=Join-Path (Get-Location) '.tools/dotnet/dotnet.exe'
          & ./.tools/node-v24.22.0-win-x64/node.exe node_modules/tsx/dist/cli.mjs Tools/ci-snapshot.ts
          if ($LASTEXITCODE -ne 0) { throw 'Game snapshot failed; rerun after resolving diagnostics' }
      - name: Record independent build and index outcomes
        if: always()
        env:
          CHECK_OUTCOME: ${{ steps.checks.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          PACKAGE_RUNTIME_OUTCOME: ${{ steps.package-runtime.outcome }}
          AUTHORIZE_OUTCOME: ${{ steps.authorize.outcome }}
          INDEX_OUTCOME: ${{ steps.snapshot.outcome }}
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          $source=$null
          if ($env:AUTHORIZE_OUTCOME -eq 'success') {
            $source=@{repository=$env:CI_SOURCE_REPO;ref=$env:CI_SOURCE_REF;sha=$env:CI_SOURCE_SHA;runId=$env:CI_SOURCE_RUN_ID;attempt=$env:CI_SOURCE_RUN_ATTEMPT;url=$env:CI_SOURCE_RUN_URL}
          }
          @{schemaVersion=1;contractVersion='1';toolSha=$env:GITHUB_SHA;source=$source;targetRunUrl=('https://github.com/chwan886/Architecture-Explorer/actions/runs/'+$env:GITHUB_RUN_ID+'/attempts/'+$env:GITHUB_RUN_ATTEMPT);checksOutcome=$env:CHECK_OUTCOME;toolBuildCompleted=($env:CHECK_OUTCOME -eq 'success' -and $env:PACKAGE_OUTCOME -eq 'success' -and $env:PACKAGE_RUNTIME_OUTCOME -eq 'success');packageOutcome=$env:PACKAGE_OUTCOME;packageRuntimeOutcome=$env:PACKAGE_RUNTIME_OUTCOME;authorizationOutcome=$env:AUTHORIZE_OUTCOME;indexOutcome=$env:INDEX_OUTCOME;indexVerified=($env:INDEX_OUTCOME -eq 'success')} | ConvertTo-Json -Depth 5 | Set-Content test-results/delivery-result.json -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && github.event.repository.private
        id: checks-artifact
        with:
          name: tool-checks-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: tool/test-results/
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.package.outcome == 'success' && steps.package-runtime.outcome == 'success' && steps.authorize.outputs.index_access == 'allowed'
        id: tool-artifact
        with:
          name: tool-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.package.outputs.path }}
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.authorize.outputs.index_access == 'allowed'
        id: index-artifact
        with:
          name: game-index-${{ inputs.source_sha }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tool/.ci-output/*/*/index-evidence/
            tool/.ci-output/authorization/authorization.json
          retention-days: 14
          if-no-files-found: error
      - name: Link actual run and artifact outcomes
        if: always()
        env:
          TARGET_STATUS: ${{ job.status }}
          TOOL_ARTIFACT_URL: ${{ steps.tool-artifact.outputs.artifact-url }}
          INDEX_ARTIFACT_URL: ${{ steps.index-artifact.outputs.artifact-url }}
        run: |
          @"
          ## Delivery outcome
          Tool SHA: $env:GITHUB_SHA
          Game SHA: $env:CI_SOURCE_SHA
          Actual target run: https://github.com/chwan886/Architecture-Explorer/actions/runs/$env:GITHUB_RUN_ID/attempts/$env:GITHUB_RUN_ATTEMPT
          Job result at summary: $env:TARGET_STATUS
          Tool build artifact: $env:TOOL_ARTIFACT_URL
          Index evidence artifact (may contain failed-attempt diagnostics): $env:INDEX_ARTIFACT_URL
          Request receipt and target build outcome are separate. Failed jobs stay red; rerun preserves a new attempt. No game history rollback or public publication occurs.
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Freeze successful producer identity for private draft delivery
        id: release-inputs
        if: success() && steps.package-runtime.outcome == 'success' && steps.snapshot.outcome == 'success'
        env:
          TOOL_ID: ${{ steps.tool-artifact.outputs.artifact-id }}
          TOOL_DIGEST: ${{ steps.tool-artifact.outputs.artifact-digest }}
          INDEX_ID: ${{ steps.index-artifact.outputs.artifact-id }}
          INDEX_DIGEST: ${{ steps.index-artifact.outputs.artifact-digest }}
          CHECKS_ID: ${{ steps.checks-artifact.outputs.artifact-id }}
          CHECKS_DIGEST: ${{ steps.checks-artifact.outputs.artifact-digest }}
        run: |
          foreach ($kind in @('TOOL','INDEX','CHECKS')) {
            if ([Environment]::GetEnvironmentVariable($kind+'_ID') -cnotmatch '^[1-9][0-9]*$') { throw 'Missing successful producer artifact ID' }
            if ([Environment]::GetEnvironmentVariable($kind+'_DIGEST') -cnotmatch '^[a-f0-9]{64}$') { throw 'Missing frozen producer artifact digest' }
          }
          'producer_run_id='+$env:GITHUB_RUN_ID | Add-Content $env:GITHUB_OUTPUT
          'producer_attempt='+$env:GITHUB_RUN_ATTEMPT | Add-Content $env:GITHUB_OUTPUT
          'producer_tool_sha='+$env:GITHUB_SHA | Add-Content $env:GITHUB_OUTPUT
  draft-release:
    name: Verify frozen evidence and create private tool Release draft
    needs: build-index
    if: needs.build-index.result == 'success' && github.event_name == 'workflow_dispatch' && github.repository == 'chwan886/Architecture-Explorer' && github.ref == 'refs/heads/main' && github.event.repository.private
    runs-on: windows-2025
    timeout-minutes: 20
    environment: architecture-delivery
    permissions:
      contents: write
      actions: read
    concurrency:
      group: private-tool-draft-${{ github.run_id }}-${{ needs.build-index.outputs.producer_attempt }}
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
        working-directory: tool
    steps:
      - name: Checkout trusted receiving tool code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: tool
          persist-credentials: false
      - name: Prepare only the locked official publisher Node runtime
        id: runtime
        run: ./Tools/ci-release-runtime.ps1
      - name: Download the exact tool artifact as immutable ZIP bytes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build-index.outputs.tool_artifact_id }}
          github-token: ${{ github.token }}
          repository: chwan886/Architecture-Explorer
          run-id: ${{ needs.build-index.outputs.producer_run_id }}
          path: tool/.ci-release/raw/tool
          skip-decompress: true
          digest-mismatch: error
      - name: Download the exact game evidence artifact as immutable ZIP bytes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build-index.outputs.index_artifact_id }}
          github-token: ${{ github.token }}
          repository: chwan886/Architecture-Explorer
          run-id: ${{ needs.build-index.outputs.producer_run_id }}
          path: tool/.ci-release/raw/index
          skip-decompress: true
          digest-mismatch: error
      - name: Download exact check receipts without executing or extracting them
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build-index.outputs.checks_artifact_id }}
          github-token: ${{ github.token }}
          repository: chwan886/Architecture-Explorer
          run-id: ${{ needs.build-index.outputs.producer_run_id }}
          path: tool/.ci-release/raw/checks
          skip-decompress: true
          digest-mismatch: error
      - name: Validate frozen success and create only a private Release draft
        id: draft
        env:
          RELEASE_PUBLISH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build-index.result }}
          PRODUCER_RUN_ID: ${{ needs.build-index.outputs.producer_run_id }}
          PRODUCER_ATTEMPT: ${{ needs.build-index.outputs.producer_attempt }}
          PRODUCER_TOOL_SHA: ${{ needs.build-index.outputs.producer_tool_sha }}
          TOOL_ARTIFACT_ID: ${{ needs.build-index.outputs.tool_artifact_id }}
          TOOL_ARTIFACT_DIGEST: ${{ needs.build-index.outputs.tool_artifact_digest }}
          INDEX_ARTIFACT_ID: ${{ needs.build-index.outputs.index_artifact_id }}
          INDEX_ARTIFACT_DIGEST: ${{ needs.build-index.outputs.index_artifact_digest }}
          CHECKS_ARTIFACT_ID: ${{ needs.build-index.outputs.checks_artifact_id }}
          CHECKS_ARTIFACT_DIGEST: ${{ needs.build-index.outputs.checks_artifact_digest }}
          CI_CONTRACT_VERSION: ${{ inputs.contract_version }}
          CI_SOURCE_REPO: ${{ inputs.source_repo }}
          CI_SOURCE_REF: ${{ inputs.source_ref }}
          CI_SOURCE_SHA: ${{ inputs.source_sha }}
          CI_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          CI_SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          CI_SOURCE_RUN_URL: ${{ inputs.source_run_url }}
          INDEX_ACCESS_APPROVED: ${{ vars.INDEX_ACCESS_APPROVED }}
          RULE_BYPASS_REVIEWED: ${{ vars.RULE_BYPASS_REVIEWED }}
        run: |
          & '${{ steps.runtime.outputs.node }}' Tools/ci-release-draft.ts
          if ($LASTEXITCODE -ne 0) { throw 'Private tool Release draft validation or upload failed' }
      - name: Retain only sanitized draft receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && github.event.repository.private
        with:
          name: release-draft-receipt-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: tool/.ci-release/receipts/*.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
