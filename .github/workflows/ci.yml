name: CI

on:
  pull_request:
  push:
    branches: [main, 'codex/public-release']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  changes:
    name: Select CI layers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fast: ${{ steps.plan.outputs.fast }}
      integration: ${{ steps.plan.outputs.integration }}
      web: ${{ steps.plan.outputs.web }}
      node: ${{ steps.plan.outputs.node }}
      pnpm: ${{ steps.plan.outputs.pnpm }}
      dotnet: ${{ steps.plan.outputs.dotnet }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check CI selection and strict test reporting
        run: node --test .github/scripts/ci.test.mjs
      - name: Check local documentation links and images
        run: node .github/scripts/check-doc-links.mjs
      - name: Check publication privacy and project independence
        run: node Tools/export-public.mjs --check
      - name: Read changed paths and locked runtime versions
        id: plan
        run: node .github/scripts/ci-plan.mjs

  fast:
    name: Static checks and unit tests (Linux)
    needs: changes
    if: needs.changes.outputs.fast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ needs.changes.outputs.node }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ needs.changes.outputs.pnpm }}
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: node .github/scripts/ci-tests.mjs fast

  integration:
    name: Real analyzers and integration (Windows)
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ needs.changes.outputs.node }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ needs.changes.outputs.pnpm }}
          run_install: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ needs.changes.outputs.dotnet }}
      - name: Check runtimes and provide the local SDK fixture path
        run: |
          $ErrorActionPreference = 'Stop'
          python -B -c "import sys; assert sys.version_info[:2] == (3, 11); print(sys.version)"
          if ($LASTEXITCODE -ne 0) { throw 'Python runtime check failed' }
          dotnet --info
          if ($LASTEXITCODE -ne 0) { throw '.NET runtime check failed' }
          # Existing analyzer fixtures use this path; the SDK remains runner-local.
          New-Item -ItemType Directory -Path .tools -Force | Out-Null
          $sdkRoot = Split-Path -Parent (Get-Command dotnet).Source
          New-Item -ItemType Junction -Path .tools/dotnet -Value $sdkRoot | Out-Null
          "EXPLORER_DOTNET=$sdkRoot/dotnet.exe" >> $env:GITHUB_ENV
          "EXPLORER_PYTHON=$((Get-Command python).Source)" >> $env:GITHUB_ENV
      - run: pnpm install --frozen-lockfile
      - run: dotnet restore analyzers/csharp/ArchitectureExplorer.Analyzers.csproj --locked-mode
      - run: dotnet build analyzers/csharp/ArchitectureExplorer.Analyzers.csproj --configuration Release --no-restore
      - run: node .github/scripts/ci-tests.mjs integration
      - name: Inspect Windows permission metadata after a failure
        if: failure()
        run: |
          # Print identities and directory ACLs only; never read bridge state
          # or runtime credentials into the public Actions log.
          $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent()
          "CI current SID: $($identity.User.Value)"
          foreach ($relative in @('.tmp', '.cache')) {
            if (Test-Path -LiteralPath $relative -PathType Container) {
              $acl = Get-Acl -LiteralPath $relative
              [ordered]@{
                directory = $relative
                sddl = $acl.Sddl
                rules = @($acl.GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier]) | ForEach-Object {
                  [ordered]@{ sid = $_.IdentityReference.Value; access = $_.AccessControlType.ToString(); inherited = $_.IsInherited; inheritance = $_.InheritanceFlags.ToString() }
                })
              } | ConvertTo-Json -Depth 5
            }
          }
      - name: Preserve integration diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-test-results
          path: test-results/ci-integration.tap
          if-no-files-found: warn
          retention-days: 7

  web:
    name: Web components and production build (Linux)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ needs.changes.outputs.node }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ needs.changes.outputs.pnpm }}
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: node .github/scripts/ci-tests.mjs web
      - run: pnpm build
      - name: Upload production website
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: architecture-explorer-web
          path: dist/
          if-no-files-found: error
          retention-days: 7

  gate:
    # Stable layered gate. Documentation changes can pass without allocating
    # test runners; a failed or cancelled selected layer always blocks it.
    name: CI gate
    if: always()
    needs: [changes, fast, integration, web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify selected layers completed
        env:
          CHANGES: ${{ needs.changes.result }}
          FAST_SELECTED: ${{ needs.changes.outputs.fast }}
          FAST_RESULT: ${{ needs.fast.result }}
          INTEGRATION_SELECTED: ${{ needs.changes.outputs.integration }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          WEB_SELECTED: ${{ needs.changes.outputs.web }}
          WEB_RESULT: ${{ needs.web.result }}
        run: |
          test "$CHANGES" = success
          for layer in FAST INTEGRATION WEB; do
            selected="${layer}_SELECTED"
            result="${layer}_RESULT"
            if [ "${!selected}" = true ]; then
              test "${!result}" = success
            else
              test "${!result}" = skipped
            fi
          done

  protected-check:
    # Preserve the existing required check context while forwarding the same
    # gate result. This job does not rerun tests or bypass a selected layer.
    name: Tool / typecheck, tests and builds
    if: always()
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the layered CI gate to pass
        env:
          CI_GATE_RESULT: ${{ needs.gate.result }}
        run: node -e "if (process.env.CI_GATE_RESULT !== 'success') process.exit(1)"
